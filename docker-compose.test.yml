name: domix-tests

services:
  test-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: domix_test
      POSTGRES_PASSWORD: domix_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domix_test -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend-tests:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DOMIX_TEST_DATABASE_URL: postgresql://domix_test:domix_test@test-database:5432/postgres
      DOMIX_APP_ENV: test
      DOMIX_DB_HOST: test-database
      DOMIX_DB_PORT: 5432
      DOMIX_DB_NAME: postgres
      DOMIX_DB_USER: domix_test
      DOMIX_DB_PASSWORD: domix_test
    depends_on:
      test-database:
        condition: service_healthy
    command: ["python", "-m", "unittest", "discover", "-s", "backend/tests", "-v"]
