name: domix

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domix}
      POSTGRES_USER: ${POSTGRES_USER:-domix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env}
      TZ: Asia/Bangkok
    volumes:
      - domix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domix} -d ${POSTGRES_DB:-domix}"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - domix_internal

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DOMIX_APP_ENV: production
      DOMIX_DB_HOST: database
      DOMIX_DB_PORT: 5432
      DOMIX_DB_NAME: ${POSTGRES_DB:-domix}
      DOMIX_DB_USER: ${POSTGRES_USER:-domix}
      DOMIX_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DOMIX_ADMIN_EMAIL: ${DOMIX_ADMIN_EMAIL:?Hãy đặt DOMIX_ADMIN_EMAIL trong file .env}
      DOMIX_ADMIN_PASSWORD: ${DOMIX_ADMIN_PASSWORD:?Hãy đặt DOMIX_ADMIN_PASSWORD trong file .env}
      DOMIX_CORS_ORIGIN: ${DOMIX_CORS_ORIGIN:-*}
      # Thông tin công ty hiển thị toàn hệ thống — đặt trong .env, để trống thì dùng giá trị lưu trong Cài đặt.
      DOMIX_COMPANY_NAME: ${DOMIX_COMPANY_NAME:-}
      DOMIX_COMPANY_ADDRESS: ${DOMIX_COMPANY_ADDRESS:-}
      DOMIX_COMPANY_PHONE: ${DOMIX_COMPANY_PHONE:-}
      DOMIX_SMTP_HOST: ${DOMIX_SMTP_HOST:-smtp.gmail.com}
      DOMIX_SMTP_PORT: ${DOMIX_SMTP_PORT:-465}
      DOMIX_SMTP_EMAIL: ${DOMIX_SMTP_EMAIL:-}
      DOMIX_SMTP_APP_PASSWORD: ${DOMIX_SMTP_APP_PASSWORD:-}
      DOMIX_OTP_SECRET: ${DOMIX_OTP_SECRET:?Hãy đặt DOMIX_OTP_SECRET trong file .env}
      DOMIX_ANTHROPIC_API_KEY: ${DOMIX_ANTHROPIC_API_KEY:-}
      DOMIX_ANTHROPIC_MODEL: ${DOMIX_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      DOMIX_AI_TIMEOUT_SECONDS: ${DOMIX_AI_TIMEOUT_SECONDS:-120}
      TZ: Asia/Bangkok
    depends_on:
      database:
        condition: service_healthy
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - domix_internal

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${DOMIX_HTTP_PORT:-8848}:80"
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - domix_internal

volumes:
  domix_postgres_data:
    name: domix_postgres_data

networks:
  domix_internal:
    name: domix_internal
